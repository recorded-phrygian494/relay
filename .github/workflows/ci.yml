name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: unit + integration (fixtures only, never live APIs)
        run: go test ./...
      - name: docs never drift from the config schema
        run: go test ./internal/config/ -run TestDocExamplesLoad -v
      - name: coverage gate (>80% on translate and router, DESIGN §11)
        run: |
          go test -cover ./internal/translate/ ./internal/router/ | tee cover.txt
          awk '/coverage:/ { gsub("%","",$5); if ($5+0 < 80) { print "coverage below 80%:", $0; exit 1 } }' cover.txt

  race:
    # The binding §11 race gate, same container as local phase gates.
    runs-on: ubuntu-latest
    container: golang:1.25
    steps:
      - uses: actions/checkout@v4
      - name: go test -race
        run: go test -race ./...

  bench-budget:
    # §11 latency budgets are a hard test, not a benchmark to eyeball:
    # <5ms p50 non-streaming overhead, <2ms added TTFT, loopback mock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: overhead budget gate
        run: go test ./internal/server/ -run TestOverheadBudget -v

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: fuzz both inbound parsers briefly (zero panics on malformed input)
        run: |
          go test -run=^$ -fuzz=FuzzParseChatRequest -fuzztime=30s ./internal/api/openai/
          go test -run=^$ -fuzz=FuzzParseMessagesRequest -fuzztime=30s ./internal/api/anthropic/
